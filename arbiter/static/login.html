<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in to Arbiter</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="login">
    <h1>Sign in to Arbiter</h1>
    <p class="muted">Use the Linux account that runs Arbiter.</p>
    <form action="/login" method="post">
      <p class="warn" role="alert"><!-- feedback --></p>
      <label>Username <input name="username" type="text" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
