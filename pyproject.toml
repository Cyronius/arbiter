[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbiter-local"
version = "0.1.0"
description = "Local resource scheduling and communication for coding sessions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
arbiter = "arbiter.cli:main"

[tool.setuptools.package-data]
arbiter = ["static/*"]

[tool.setuptools.packages.find]
include = ["arbiter*"]
